# ============================================================
# TaskFlow — продакшен-демо для слабого VPS (~1 ГБ RAM)
# Образ backend СОБИРАЕТСЯ ЛОКАЛЬНО и загружается на сервер (docker load).
#
# PostgreSQL НЕ входит в этот стек — используется уже развёрнутый на VPS
# (порт 5432 проброшен на хост). Backend подключается через host.docker.internal.
#
# Запуск на VPS:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Остановка:
#   docker compose -f docker-compose.prod.yml down
# ============================================================

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    mem_limit: 256m
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    image: ${BACKEND_IMAGE:-taskflow-backend:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_OPTIONS: "--max-old-space-size=256"
    extra_hosts:
      # Доступ к Postgres на хосте VPS (порт 5432 проброшен из другого контейнера)
      - "host.docker.internal:host-gateway"
    mem_limit: 384m
    ports:
      - "${PORT:-3100}:${PORT:-3100}"
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:'+(process.env.PORT||3100)+'/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  minio_data:
